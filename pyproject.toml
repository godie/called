[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "called"
version = "0.1.0"
description = "Real-time audio transcription using faster-whisper"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Diego Mendoza Salas" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"

dependencies = [
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyogg>=0.6",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
]

[project.scripts]
called = "app:main"

[project.urls]
Homepage = "https://github.com/your-org/called"
Repository = "https://github.com/your-org/called.git"
Issues = "https://github.com/your-org/called/issues"

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
include = ["audio*", "transcription*", "storage*", "cli*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
