[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "called"
version = "0.1.0"
description = "Real-time audio transcription using faster-whisper"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Diego Mendoza Salas" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"

dependencies = [
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyogg>=0.6",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
called = "app:main"

[project.urls]
Homepage = "https://github.com/godie/called"
Repository = "https://github.com/godie/called.git"
Issues = "https://github.com/godie/called/issues"

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
include = ["audio*", "transcription*", "storage*", "cli*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["B008", "B028"]

[tool.ruff.lint.isort]
known-first-party = ["audio", "transcription", "storage", "cli", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
pythonpath = ["."]
